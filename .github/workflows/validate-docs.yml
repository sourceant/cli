name: Validate Docs

on:
  push:
    paths: ['docs/**', 'docs.json', '.github/workflows/validate-docs.yml']
  pull_request:
    paths: ['docs/**', 'docs.json', '.github/workflows/validate-docs.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: whilesmart/docs-kit/.github/actions/validate-docs@main
